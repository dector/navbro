<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>navbro settings</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; padding: 28px 18px; background: #101010; color: #e9ecef; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .wrap { max-width: 760px; margin: 0 auto; }
      h1 { margin: 0 0 16px; font-size: 24px; }
      .setting-item { border: 1px solid #2f3338; background: #17191b; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
      .setting-title { margin: 0 0 8px; color: #c2c7cc; font-size: 14px; }
      .hint { color: #9aa1a8; font-size: 12px; margin-top: 6px; }
      input[type="text"], select { width: 100%; height: 40px; border: 1px solid #3a3f44; border-radius: 10px; background: #191b1d; color: #f3f5f7; padding: 0 12px; font-size: 14px; box-sizing: border-box; }
      .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
      .actions { display: flex; gap: 10px; align-items: center; }
      button { border: 1px solid #4a5057; border-radius: 10px; background: #25292d; color: #f3f5f7; padding: 9px 13px; font-size: 14px; cursor: pointer; }
      button:hover, button:focus-visible { background: #2f3439; border-color: #69727a; outline: none; }
      .status { font-size: 13px; min-height: 18px; }
      .status.ok { color: #77d28c; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>navbro settings</h1>

      <section class="setting-item">
        <p class="setting-title">Text shown on new tab page</p>
        <input id="newtabText" type="text" maxlength="120" autocomplete="off" placeholder="=^_^=" />
        <div class="hint">If empty: <strong>=^_^=</strong></div>
      </section>

      <section class="setting-item">
        <p class="setting-title">Pass mode indicator visibility (passModeVibisibility)</p>
        <select id="passModeVibisibility">
          <option value="show-always">Show always</option>
          <option value="hide-always">Hide always</option>
          <option value="hide-filterlist-only">Hide only for filterlist</option>
        </select>
      </section>

      <section class="setting-item">
        <p class="setting-title">Mode indicator position</p>
        <select id="indicatorPosition">
          <option value="top-left">Top left</option>
          <option value="top-center">Top center</option>
          <option value="top-right">Top right</option>
          <option value="center-left">Center left</option>
          <option value="center-right">Center right</option>
          <option value="bottom-left">Bottom left</option>
          <option value="bottom-center">Bottom center</option>
          <option value="bottom-right">Bottom right</option>
        </select>
      </section>

      <div class="footer">
        <button id="backBtn" type="button">← Back</button>
        <div class="actions">
          <button id="resetBtn" type="button">Reset</button>
          <button id="saveBtn" type="button">Save</button>
          <span id="status" class="status" role="status" aria-live="polite"></span>
        </div>
      </div>
    </main>
    <script src="options-page.js"></script>
  </body>
</html>
