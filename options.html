<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>navbro settings</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        padding: 32px 20px;
        background: #101010;
        color: #e9ecef;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      }

      .wrap {
        max-width: 700px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 18px;
        font-size: 24px;
      }

      .setting-item {
        border: 1px solid #2f3338;
        background: #17191b;
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 16px;
      }

      .setting-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
      }

      .setting-title {
        color: #c2c7cc;
        font-size: 14px;
      }

      .reset-btn {
        border: 1px solid #4a5057;
        border-radius: 8px;
        background: #25292d;
        color: #f3f5f7;
        padding: 6px 10px;
        font-size: 13px;
        cursor: pointer;
      }

      .reset-btn:hover,
      .reset-btn:focus-visible {
        background: #2f3439;
        border-color: #69727a;
        outline: none;
      }

      .hidden {
        display: none !important;
      }

      .display-value {
        position: relative;
        width: 100%;
        height: 41px;
        box-sizing: border-box;
        border: 1px solid #3a3f44;
        border-radius: 10px;
        background: #191b1d;
        color: #f3f5f7;
        padding: 0 12px;
        font-size: 15px;
        display: flex;
        align-items: center;
        cursor: text;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .display-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 10, 10, 0.74);
        border-radius: 10px;
        color: #d7dcf1;
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 120ms ease;
      }

      .display-value:hover .display-overlay,
      .display-value:focus-visible .display-overlay {
        opacity: 1;
      }

      .editor-wrap {
        border-radius: 12px;
      }

      .editor-wrap.unsaved {
        box-shadow: 0 0 0 1px #f0c66d, 0 0 0 3px rgba(240, 198, 109, 0.25);
      }

      input[type="text"] {
        width: 100%;
        height: 41px;
        border: 1px solid #3a3f44;
        border-radius: 10px;
        background: #191b1d;
        color: #f3f5f7;
        padding: 0 12px;
        font-size: 15px;
        box-sizing: border-box;
      }

      input[type="text"]:focus-visible {
        outline: 2px solid #5865f2;
        outline-offset: 1px;
      }

      .hint {
        color: #9aa1a8;
        font-size: 13px;
        margin-top: 8px;
      }

      .actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      button {
        border: 1px solid #4a5057;
        border-radius: 10px;
        background: #25292d;
        color: #f3f5f7;
        padding: 9px 13px;
        font-size: 14px;
        cursor: pointer;
      }

      button:hover,
      button:focus-visible {
        background: #2f3439;
        border-color: #69727a;
        outline: none;
      }

      .status {
        font-size: 13px;
        min-height: 18px;
      }

      .status.ok {
        color: #77d28c;
      }

      .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 22px;
      }

      .back-btn {
        font-size: 13px;
        padding: 8px 12px;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>navbro settings</h1>

      <section class="setting-item" id="newtabSetting">
        <div class="setting-header">
          <label class="setting-title" for="newtabText">Text shown on new tab page</label>
          <button id="newtabResetBtn" class="reset-btn hidden" type="button">Reset</button>
        </div>

        <div id="newtabDisplay" class="display-value" tabindex="0" role="button" aria-label="Click to edit text shown on new tab page">
          <span id="newtabDisplayText"></span>
          <span class="display-overlay">Click to edit…</span>
        </div>

        <div id="newtabEditor" class="editor-wrap hidden">
          <input id="newtabText" type="text" maxlength="120" autocomplete="off" placeholder="=^_^=" />
        </div>

        <div class="hint">If empty: <strong>"=^_^="</strong></div>
      </section>

      <div class="footer">
        <button id="backBtn" class="back-btn" type="button">← Back</button>

        <div class="actions">
          <button id="saveBtn" class="hidden" type="button">Save</button>
          <span class="status" id="status" role="status" aria-live="polite"></span>
        </div>
      </div>
    </main>

    <script src="options-page.js"></script>
  </body>
</html>
