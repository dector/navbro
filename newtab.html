<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1e1e1e 0%, #111 48%, #0b0b0b 100%);
        color: #9aa0a6;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      }

      .hello {
        font-size: clamp(72px, 18vw, 220px);
        font-weight: 800;
        letter-spacing: 0.02em;
        line-height: 1;
        margin: 0;
        text-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      }
    </style>
  </head>
  <body>
    <h1 class="hello">Hi!</h1>

    <script src="key-config.js"></script>
    <script src="content.js"></script>
  </body>
</html>
